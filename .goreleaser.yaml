version: 2
project_name: spark-mcp

builds:
  - id: server
    main: ./cmd/spark-mcp
    binary: spark-mcp
    env: [CGO_ENABLED=0]
    # The spark CLI talks to Spark Desktop over local IPC, so the server runs
    # on the same Mac. No container image: a container cannot reach the app.
    goos: [darwin]
    goarch: [arm64, amd64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    flags: ["-trimpath"]

archives:
  - id: default
    formats: [tar.gz]
    files: [LICENSE, NOTICE, README.md, config.example.yaml, deploy/launchd/spark-mcp.plist]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: vaxann
    name: spark-mcp
  draft: false
